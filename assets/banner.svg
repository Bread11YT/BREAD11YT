<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f2219"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#b6f36a"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#3ddc84" opacity="0.08"/>
    </pattern>
    <clipPath id="c1"><rect class="r r1" x="172" y="125" width="0" height="40"/></clipPath>
    <clipPath id="c2"><rect class="r r2" x="280" y="125" width="0" height="40"/></clipPath>
    <clipPath id="c3"><rect class="r r3" x="256" y="125" width="0" height="40"/></clipPath>
  </defs>

  <style>
    .title { font: bold 64px 'Segoe UI', Arial, sans-serif; fill: url(#title); animation: glow 3s ease-in-out infinite; }
    .line { font: 20px 'Courier New', monospace; fill: #c9d1d9; }
    .r { animation-duration: 9s; animation-iteration-count: infinite; }
    .r1 { animation-name: t1; animation-timing-function: steps(38); }
    .r2 { animation-name: t2; animation-timing-function: steps(20); animation-delay: 3s; }
    .r3 { animation-name: t3; animation-timing-function: steps(24); animation-delay: 6s; }
    @keyframes t1 { 0% { width: 0 } 14% { width: 456px } 30% { width: 456px } 31%, 100% { width: 0 } }
    @keyframes t2 { 0% { width: 0 } 14% { width: 240px } 30% { width: 240px } 31%, 100% { width: 0 } }
    @keyframes t3 { 0% { width: 0 } 14% { width: 288px } 30% { width: 288px } 31%, 100% { width: 0 } }
    @keyframes glow { 0%, 100% { opacity: 1 } 50% { opacity: .65 } }
    .p { animation: float 6s ease-in-out infinite; }
    .p2 { animation-delay: -2s; animation-duration: 7s; }
    .p3 { animation-delay: -4s; animation-duration: 8s; }
    @keyframes float { 0%, 100% { transform: translateY(0); opacity: .15 } 50% { transform: translateY(-18px); opacity: .5 } }
  </style>

  <!-- background + pixel dot grid -->
  <rect width="800" height="220" rx="16" fill="url(#bg)"/>
  <rect width="800" height="220" rx="16" fill="url(#grid)"/>

  <!-- static frame: thin outer line, inner hairline, game-HUD corner brackets -->
  <rect x="1" y="1" width="798" height="218" rx="15" fill="none" stroke="#1f3a2b" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="200" fill="none" stroke="#3ddc84" stroke-opacity="0.16" stroke-width="1"/>
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="square">
    <path d="M10 40 V10 H40"/>
    <path d="M760 10 H790 V40"/>
    <path d="M790 180 V210 H760"/>
    <path d="M40 210 H10 V180"/>
  </g>
  <g fill="#3ddc84">
    <rect x="16" y="16" width="5" height="5"/>
    <rect x="779" y="16" width="5" height="5"/>
    <rect x="779" y="199" width="5" height="5"/>
    <rect x="16" y="199" width="5" height="5"/>
  </g>

  <!-- floating pixels -->
  <rect class="p" x="60" y="150" width="14" height="14" fill="#3ddc84"/>
  <rect class="p p2" x="120" y="60" width="10" height="10" fill="#2dd4bf"/>
  <rect class="p p3" x="690" y="140" width="16" height="16" fill="#7ee787"/>
  <rect class="p p2" x="730" y="50" width="10" height="10" fill="#3ddc84"/>
  <rect class="p" x="640" y="170" width="8" height="8" fill="#2dd4bf"/>
  <rect class="p p3" x="90" y="110" width="8" height="8" fill="#7ee787"/>

  <text class="title" x="400" y="95" text-anchor="middle">Bread11</text>

  <!-- typed lines, one after another -->
  <g clip-path="url(#c1)"><text class="line" x="172" y="150">Publishing games on itch.io &amp; Telegram</text></g>
  <g clip-path="url(#c2)"><text class="line" x="280" y="150">Making Android games</text></g>
  <g clip-path="url(#c3)"><text class="line" x="256" y="150">Your support means a lot</text></g>
</svg>
