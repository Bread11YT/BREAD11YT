<svg xmlns="http://www.w3.org/2000/svg" width="800" height="6" viewBox="0 0 800 6">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff8c00"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#ff8c00"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="200 0" dur="3s" repeatCount="indefinite"/>
