<svg xmlns="http://www.w3.org/2000/svg" width="800" height="56" viewBox="0 0 800 56" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { font: bold 30px 'Segoe UI', Arial, sans-serif; fill: #3ddc84; animation: slide 1.2s ease-out both; }
    .u { fill: #3ddc84; width: 0; animation: grow 1.4s ease-out .3s forwards; }
    @keyframes slide { from { opacity: 0; transform: translateX(-30px) } to { opacity: 1; transform: translateX(0) } }
    @keyframes grow { to { width: 800px } }
  </style>
  <text class="t" x="4" y="36">📊 GitHub Stats</text>
  <rect class="u" x="0" y="48" height="3" rx="1.5"/>
</svg>
