name: Update profile stats

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов
  workflow_dispatch:         # ручной запуск кнопкой

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVG cards
        env:
          GH_USER: Bread11YT
          # PAT (секрет STATS_TOKEN) нужен, чтобы считать приватные вклады; без него — публичные
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python3 scripts/generate_stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/streak.svg
          git diff --staged --quiet || git commit -m "chore: update stats" && git push
